; CrowPanel ESP32 E-Paper 4.2" HMI Display (green-sticker revision)
; ESP32-S3-WROOM-1-N8R8 (8 MB flash, 8 MB PSRAM), UC8276C/DIE07300S 400x300 e-paper
; https://www.elecrow.com/wiki/CrowPanel_ESP32_E-paper_4.2-inch_HMI_Display.html

[env:crowpanel_42e]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N8R8: 8 MB quad flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

upload_port = /dev/cu.usbserial-830
monitor_port = /dev/cu.usbserial-830
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The board talks over a USB-UART bridge on UART0, not native USB CDC.
; CDC_ON_BOOT must stay 0 or Serial goes out the (unconnected) USB peripheral.
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D BOARD_HAS_PSRAM

lib_deps =
	zinggjm/GxEPD2@^1.6.2
	adafruit/Adafruit GFX Library@^1.11.11
